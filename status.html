<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application status</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 42rem);
        padding: 2.5rem;
        border: 1px solid #d9e2ef;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1rem 2.5rem rgb(23 32 51 / 8%);
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0;
        padding: 1rem;
        border-radius: 0.75rem;
        background: #eaf8ef;
        color: #14532d;
        font-size: 1.125rem;
        font-weight: 700;
      }

      .status::before {
        width: 0.75rem;
        height: 0.75rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #22c55e;
        content: "";
      }

      .updated {
        margin: 1rem 0 0;
        color: #526078;
      }

      @media (max-width: 36rem) {
        body {
          align-items: start;
          padding: 1rem;
        }

        main {
          margin-top: 2rem;
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <h1 id="page-title">Application status</h1>
      <p class="status" role="status">All systems operational</p>
      <p class="updated">The application is available and running normally.</p>
    </main>
  </body>
</html>
